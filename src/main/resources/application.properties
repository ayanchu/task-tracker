spring.application.name=tasktracker
spring.jackson.deserialization.fail-on-unknown-properties=true


spring.datasource.url=jdbc:postgresql://localhost:5433/tasktracker
spring.datasource.username=tasktracker
spring.datasource.password=tasktracker

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spting.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.placeholders.build_timestamp=${BUILD_TS:dev}