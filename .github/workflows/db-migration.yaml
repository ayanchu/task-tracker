name: DB Migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: db-migration${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:11.10.4
        env:
          POSTGRES_USER: tasktracker
          POSTGRES_PASSWORD: tasktracker
          POSTGRES_DB: tasktracker
        ports:
          - 5433:5432
        options:
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLYWAY_URL: jdbc:postgresql://localhost:5433/tasktracker
      FLYWAY_USER: tasktracker
      FLYWAY_PASSWORD: tasktracker
      FLYWAY_PLACEHOLDERS_BUILD_TIMESTAMP: "${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process Resources
        shell: bash
        run: |
          ./mvnw process-resources

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '24'
          cache: maven

      - name: Flyway migrate and validate
        run: mvn -B flyway:migrate

      - name: Flyway validate
        run: mvn -B flyway:validate

      - name: Run tests
        run: ./mvnw test

      - name: Deploy app
        if: success()
        run: echo "Deploy your app here..."
